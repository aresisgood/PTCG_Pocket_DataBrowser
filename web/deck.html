<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTCG Pocket 牌組實驗室</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="deck.css" />
</head>
<body>
  <header>
    <div class="header-row">
      <h1><span class="dot"></span> 牌組實驗室</h1>
      <nav class="nav"><a href="index.html">← 卡牌檢索</a></nav>
      <span id="status" class="count">載入中…</span>
    </div>
  </header>

  <main class="lab">
    <!-- 左:卡庫 -->
    <section class="picker">
      <input id="search" class="search" type="search"
             placeholder="搜尋卡牌加入牌組…" autocomplete="off" />
      <div id="picker-grid" class="grid"></div>
    </section>

    <!-- 右:牌組 + 預測 -->
    <aside class="builder">
      <div class="panel">
        <div class="deck-head">
          <input id="deck-name" class="deck-name" placeholder="牌組名稱" />
          <span id="deck-count" class="deck-count">0</span>
        </div>
        <div id="deck-list" class="deck-list"></div>
        <div class="deck-actions">
          <button id="btn-save" class="btn primary">儲存</button>
          <button id="btn-new" class="btn">清空</button>
          <select id="saved-decks" class="saved-select"><option value="">— 已存牌組 —</option></select>
          <button id="btn-delete" class="btn danger" title="刪除選取的已存牌組">🗑</button>
        </div>
      </div>

      <div class="panel">
        <button id="btn-predict" class="btn primary wide">預測勝率</button>
        <div id="predict-result" class="predict-result"></div>
      </div>

      <div class="panel">
        <details>
          <summary>當前 Meta（近期賽事）</summary>
          <div id="meta-list" class="meta-list"></div>
        </details>
      </div>
    </aside>
  </main>

  <script src="deck.js"></script>
</body>
</html>
